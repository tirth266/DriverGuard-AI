<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DriverGuard AI — Intelligent fleet safety platform. Detect fatigue, phone usage, distracted driving, and unsafe behaviors in real time to protect every journey." />
    <title>DriverGuard AI | Intelligent Fleet Safety Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        // Must match THEME_KEY in src/context/ThemeContext.tsx. It used to be
        // 'driverguard-theme', a key nothing ever wrote, so this anti-flash
        // script always fell through to prefers-color-scheme and every load
        // flashed the opposite theme for users who had chosen one.
        var stored = localStorage.getItem('driverguard_theme_preference');
        var theme = stored;
        if (!theme) {
          theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
